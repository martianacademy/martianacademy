name: Render Remotion Demo

on:
  push:
    branches: [main]
    paths:
      - 'remotion-demo/**'
      - '.github/workflows/render-remotion-demo.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: remotion-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-demo-video
          path: remotion-demo/out/demo.mp4
          if-no-files-found: error
